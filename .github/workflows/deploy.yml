name: Deploy Card Casino

on:
  push:
    branches: [main]
    paths:
      - 'card-casino/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write # needed for AWS OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card-casino
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card-casino/package-lock.json

      - run: npm ci
      - run: npm test --if-present
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed assets can be cached forever; index.html must always be revalidated.
      - name: Upload assets
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
